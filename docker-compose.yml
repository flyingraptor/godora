version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - GIT_REPO_PATH=/app/backend
    command: go run ./cmd/api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8099 